name: liferadar
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  http: ^1.6.0
  intl: ^0.20.2
  kakao_map_sdk: ^1.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    # tool/collect_events.dart yaratadi
    - assets/data/events.json
  fonts:
    # Pretendard 1.3.9 subset (lotin + KS X 1001 hangul), OFL — assets/fonts/OFL.txt
    - family: LifeRadarSans
      fonts:
        - asset: assets/fonts/LifeRadarSans-Regular.otf
          weight: 400
        - asset: assets/fonts/LifeRadarSans-SemiBold.otf
          weight: 600
        - asset: assets/fonts/LifeRadarSans-Bold.otf
          weight: 700
